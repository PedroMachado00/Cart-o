<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão 3D</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #f0f2f5;
    font-family: Arial, sans-serif;
  }

  /* Container externo: define o tamanho e a perspectiva 3D */
  .cartao {
    width: 300px;
    height: 400px;
    perspective: 1000px;
  }

  /* O seu código: parte interna que gira */
  .cartao-interno {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }

  /* Vira o cartão ao passar o mouse ou ao focar (teclado/toque) */
  .cartao:hover .cartao-interno,
  .cartao:focus .cartao-interno {
    transform: rotateY(180deg);
  }

  /* Estilo comum às duas faces */
  .frente, .verso {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .frente {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
  }

  .verso {
    background: #2d3436;
    color: #fff;
    transform: rotateY(180deg);
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="cartao" tabindex="0">
    <div class="cartao-interno">
      <div class="frente">
        <h2>Frente</h2>
        <p>Passe o mouse aqui</p>
      </div>
      <div class="verso">
        <h2>Verso</h2>
        <p>Este é o outro lado do cartão!</p>
      </div>
    </div>
  </div>

</body>
</html>
